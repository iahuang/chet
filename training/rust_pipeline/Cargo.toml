[package]
name = "chet-data-pipeline"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "chet-data-pipeline"
path = "src/main.rs"

[dependencies]
pgn-reader = "0.27"
shakmaty = "0.28"
rayon = "1.10"
csv = "1.3"
rand = "0.8"
zstd = "0.13"
clap = { version = "4", features = ["derive"] }
walkdir = "2"
toml = "0.8"
serde = { version = "1", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
zip = "2"
indicatif = "0.17"

[profile.release]
opt-level = 3
lto = true
